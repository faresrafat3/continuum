name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CLI is standard-library only by design, so it must hold on the
        # oldest supported interpreter as well as the current one. The
        # no-extras leg exercises the fail-closed path where the optional
        # PyYAML/jsonschema validators are absent.
        include:
          - {name: py3.10 with validators, python-version: "3.10", no-extras: false}
          - {name: py3.12 with validators, python-version: "3.12", no-extras: false}
          - {name: py3.12 without validators, python-version: "3.12", no-extras: true}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the ancestor check needs real history, not a shallow clone

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional validators
        # PyYAML and jsonschema are optional at runtime. CI exercises both
        # the fail-closed path (absent) and the full path (present).
        if: ${{ !matrix.no-extras }}
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Strict doctor
        # Without the optional validators, strict mode is designed to fail
        # closed. That is the contract, so it is asserted rather than run.
        if: ${{ !matrix.no-extras }}
        run: python -B bin/continuum-workspace doctor --strict

      - name: Strict doctor must fail closed without validators
        if: ${{ matrix.no-extras }}
        run: |
          output="$(python -B bin/continuum-workspace doctor --strict || true)"
          echo "$output"
          if ! grep -q "schema validation unavailable" <<<"$output"; then
            echo "::error::strict mode did not fail closed without its validators"
            exit 1
          fi
          echo "strict mode fails closed as designed"

      - name: Unit and adversarial tests
        # The suite asserts the live preset install matches the archive, which
        # is a property of a developer machine, not of this commit. It is
        # skipped here; ./install.sh --check below covers the install path.
        if: ${{ !matrix.no-extras }}
        run: python -B -m unittest discover -s .agent-workspace/tests -v

      - name: Plugin regression
        run: node plugins/continuum-handoff.test.mjs

      - name: Installer round-trip in a throwaway home
        # A CI runner has no presets installed, so --check would refuse. Drive
        # a full install/verify/uninstall cycle against a temporary DSH home
        # instead, and assert the user plane is left exactly as found.
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          ./install.sh
          ./install.sh --check
          ./install.sh --workspace "$RUNNER_TEMP/proj"
          ./install.sh --uninstall
          if [ -n "$(ls -A "$DSH_HOME/.agent-presets" 2>/dev/null)" ]; then
            echo "::error::uninstall left files behind in the user preset plane"
            ls -A "$DSH_HOME/.agent-presets"
            exit 1
          fi
          echo "install, verify, workspace init and uninstall all behave"

      # The repository must never contain evidence that the control plane was
      # touched. This is a structural assertion, not a promise.
      - name: Assert no DSH deployment paths are tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.nvm|node_modules)/|dsh-agent-presets|host\.cordis\.yml'; then
            echo "::error::a DSH deployment or control-plane path is tracked in this repository"
            exit 1
          fi
          echo "no deployment or control-plane path is tracked"

      # A green suite proves nothing unless the suite can fail. Break one
      # guard on a scratch copy and require the suite to notice.
      - name: Break a guard and require failure
        run: |
          cp bin/continuum-workspace "$RUNNER_TEMP/continuum-workspace.bak"
          python - <<'PY'
          import re, pathlib
          path = pathlib.Path("bin/continuum-workspace")
          source = path.read_text(encoding="utf-8")
          # Remove the empty-scaffold warning: a guard with no test is not a guard.
          broken, count = re.subn(
              r"            if not _has_real_record\(\):\n                warnings\.append\(",
              "            if False:\n                warnings.append(", source, count=1)
          if count != 1:
              raise SystemExit("mutation target not found; update this job")
          path.write_text(broken, encoding="utf-8")
          PY
          if python -B -m unittest discover -s .agent-workspace/tests >/dev/null 2>&1; then
            echo "::error::the suite still passes with a guard removed, so it is not evidence"
            exit 1
          fi
          echo "the suite correctly fails when a guard is removed"
          cp "$RUNNER_TEMP/continuum-workspace.bak" bin/continuum-workspace

      - name: Local benchmark smoke
        # Timings are machine-specific and are not asserted; this only proves
        # the benchmark runs. Skipped on the no-validators leg, because the
        # benchmark's own doctor calls are expected to fail there.
        if: ${{ !matrix.no-extras }}
        run: python -B bench/benchmark.py --quick --repeats 2
